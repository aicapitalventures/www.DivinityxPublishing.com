name: Assemble approved brand assets v1.2

on:
  push:
    branches:
      - build/07-production-brand-identity-lock
    paths:
      - ".brand-staging/**"
      - ".github/workflows/assemble-brand-assets-v1.2.yml"

permissions:
  contents: write

jobs:
  assemble:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled branch
        uses: actions/checkout@v4
        with:
          ref: build/07-production-brand-identity-lock
          fetch-depth: 0

      - name: Assemble and verify exact approved binaries
        shell: bash
        run: |
          set -euo pipefail
          cat .brand-staging/wordmark.*.b64 | base64 --decode > assets/brand/divinityx-publishing-wordmark-gold.webp
          cat .brand-staging/crest.*.b64 | base64 --decode > assets/brand/divinityx-publishing-crest-gold.webp
          test "$(git hash-object assets/brand/divinityx-publishing-wordmark-gold.webp)" = "2a0d0b11b968617797a708f89f167ec47e43487f"
          test "$(git hash-object assets/brand/divinityx-publishing-crest-gold.webp)" = "8cd728ed3b3335ee5e518245a9d180cda43b8f17"
          rm -rf .brand-staging

      - name: Commit assembled assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand .brand-staging
          git commit -m "DPC brand v1.2: assemble approved high-resolution identity assets [skip ci]"
          git push origin HEAD:build/07-production-brand-identity-lock
